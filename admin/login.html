<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrator Login | Blush &amp; Basics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <main class="login-shell">
    <a class="back-link" href="../index.html">&larr; Back to store</a>

    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">B&amp;B</div>
      <p class="eyebrow">BLUSH &amp; BASICS</p>
      <h1 id="login-title">Welcome back</h1>
      <p class="intro">Sign in to manage your store.</p>

      <form id="loginForm" novalidate>
        <label for="email">Administrator email</label>
        <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button class="show-password" id="togglePassword" type="button" aria-label="Show password">Show</button>
        </div>

        <p class="message" id="message" role="alert" aria-live="polite"></p>
        <button class="submit-btn" id="submitBtn" type="submit">Sign in</button>
      </form>

      <p class="security-note"><span aria-hidden="true">&#128274;</span> Secure administrator access</p>
    </section>
    <p class="copyright">&copy; <span id="year"></span> Blush &amp; Basics</p>
  </main>
  
</body>
</html>
